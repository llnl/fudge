name: FUDGE pip install

on: [push]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display environment
        run: python -c "import sys, platform; print(platform.system()); print(sys.version)"

      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy h5py

      - name: Install FUDGE
        run:  |
              if [ "$RUNNER_OS" == "Windows" ]; then
                  export CC=gcc
              fi
              python -m pip install git+https://github.com/LLNL/fudge.git@ci_dev
        shell: bash

